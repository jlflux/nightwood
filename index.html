<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101822">
<meta name="description" content="Nightwood: explore Homewood and its shadow realm, fight with the Night Splitter, grow modern skills, and play arcade and library games.">
<title>Nightwood — The Other Side of Home</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app" class="app">
  <header class="top">
    <div class="brand"><span class="brand-mark">◈</span><span><b>NIGHTWOOD</b><small>THE OTHER SIDE OF HOME</small></span></div>
    <div class="identity"><span id="playerLabel">Student</span><span class="pill" id="realmLabel">HOMEWOOD</span><span class="pill">LV <b id="levelLabel">1</b></span></div>
    <div class="head-actions"><button id="helpBtn" class="muted">Controls</button><button id="resetBtn" class="muted" title="Start a new character">New</button><span id="saveLabel" class="subtle">Local save</span></div>
  </header>
  <div class="workspace">
    <section class="world-section">
      <div class="game-frame">
        <canvas id="world" width="960" height="630" aria-label="Top-down Nightwood game world"></canvas>
        <div class="hud">
          <div class="vitals"><div class="stat-row"><span>HP</span><div class="meter"><i id="hpFill"></i></div><b id="hpText">100</b></div><div class="stat-row"><span>MAGIC</span><div class="meter magic"><i id="focusFill"></i></div><b id="focusText">100</b></div><div class="stat-row dread-row" id="dreadRow"><span>DREAD</span><div class="meter dread"><i id="dreadFill"></i></div><b id="dreadText">0</b></div></div>
          <div id="questBanner" class="quest">GETTING STARTED · EXPLORE HOMEWOOD HIGH</div>
        </div>
        <div id="prompt" class="world-prompt">WASD / arrow keys to move • E interact • Click to walk</div>
        <div class="touch-controls"><div class="touch-pad"><button data-move="up">▲</button><div><button data-move="left">◀</button><button data-move="down">▼</button><button data-move="right">▶</button></div></div><div class="touch-actions"><button id="touchAttack" class="combat">SWORD</button><button id="touchPulse" class="combat">PULSE</button><button id="touchDodge" class="combat">DODGE</button><button id="touchInteract">USE</button></div></div>
      </div>
      <div class="bottom-bar">
        <div class="control-tip"><b>MOVE</b> WASD / arrows / click <span>·</span> <b>INTERACT</b> E <span>·</span> <b>SWORD</b> Space <span>·</span> <b>PULSE</b> F <span>·</span> <b>DODGE</b> Shift</div>
        <div class="quick-actions"><button id="quickArcade">🎮 Arcade</button><button id="quickLibrary">♣ Library</button><button id="homeBtn">⌂ Home</button></div>
      </div>
    </section>
    <aside class="panel">
      <div class="panel-nav"><button data-tab="journal" class="active">Journal</button><button data-tab="skills">Skills</button><button data-tab="profile">Profile</button></div>
      <div id="panelBody" class="panel-body" aria-live="polite"></div>
      <div class="panel-footer"><span>Single player prototype</span><button id="exportBtn">Export save</button></div>
    </aside>
  </div>
</div>
<div id="screenLayer" class="screen-layer hidden" role="presentation"><div id="screen" class="screen" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" aria-live="polite"></div>
<script src="./core.js"></script><script src="./game.js"></script>
</body>
</html>
